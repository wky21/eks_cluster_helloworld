name: Terraform - Provision EKS

on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      #  REQUIRED for OIDC
      contents: read
    env:
      AWS_REGION: us-east-1
      TF_VAR_cluster_name: "eks-test-cluster"

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configure AWS credentials for the GitHub Actions role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::713881830177:role/GitHubTerraformEKS
          aws-region: ${{ env.AWS_REGION }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest  # adjust version if needed

      # 3.1 Install Helm CLI to avoid provider download failures
      - name: Install Helm CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # 4. Initialize Terraform with existing S3 + DynamoDB backend (upgrade providers to match required_providers)
      - name: Terraform Init
        working-directory: terraform/environments/test
        run: terraform init -upgrade

      # 5. Terraform Apply - create cluster only (target module.eks)
      - name: Terraform Apply - create cluster
        working-directory: terraform/environments/test
        run: terraform apply -target=module.eks -auto-approve -lock-timeout=5m

      # 6. Wait for EKS cluster to be ACTIVE
      - name: Wait for EKS cluster to be ACTIVE
        run: |
          aws eks wait cluster-active --name ${{ env.TF_VAR_cluster_name }} --region ${{ env.AWS_REGION }}

      # 7. Terraform Apply - remaining resources (includes RBAC)
      - name: Terraform Apply - finish
        working-directory: terraform/environments/test
        run: terraform apply -auto-approve -lock-timeout=5m