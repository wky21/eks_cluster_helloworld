name: CI - Build and Push to ECR

on:
  workflow_dispatch:
  # Uncomment if you want to trigger on push
  # push:
  #   branches:
  #     - main

env:
  AWS_REGION: us-east-1    
  ECR_REPOSITORY: eks-cluster-helloworld
  IMAGE_TAG: latest
  CLUSTER_NAME: eks-test-cluster

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, tag, and push Docker image
      - name: Build, tag, and push image
        run: |
          # Build image with "latest" tag
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG -f scripts/Dockerfile scripts/

          # Tag for ECR registry
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

          # Push to ECR
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

      # 5. Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # 6. Update kubeconfig for the EKS cluster
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # 7. Deploy manifest and update image using kubectl set image
      - name: Deploy to EKS
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          kubectl apply -f k8s/helloworld-app.yaml
          kubectl set image deployment/nginx-hello-world nginx-hello-world="$IMAGE" -n default
          kubectl rollout status deployment/nginx-hello-world -n default --timeout=120s

      # 8. Wait for and print Service LoadBalancer ingress (hostname/IP)
      - name: Wait for LoadBalancer ingress
        run: |
          echo "Waiting for LoadBalancer ingress for service/nginx-hello-world (timeout 10m)..."
          MAX_WAIT=600
          SLEEP=15
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HOST=$(kubectl get svc nginx-hello-world -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            IP=$(kubectl get svc nginx-hello-world -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$HOST" ] || [ -n "$IP" ]; then
              echo "LoadBalancer ingress available:"
              kubectl get svc nginx-hello-world -n default -o wide
              echo "hostname: $HOST"
              echo "ip: $IP"
              exit 0
            fi
            echo "No ingress yet. Sleeping $SLEEP seconds... (elapsed ${ELAPSED}s)"
            sleep $SLEEP
            ELAPSED=$((ELAPSED+SLEEP))
          done
          echo "Timed out waiting for LoadBalancer ingress after ${MAX_WAIT}s"
          kubectl get svc nginx-hello-world -n default -o wide
          exit 1