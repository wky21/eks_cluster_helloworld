apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helloworld
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/wky21/eks_cluster_helloworld.git"
    path: charts/helloworld
    targetRevision: HEAD
    helm:
      valueFiles: []
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
