apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helloworld-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/wky21/eks_cluster_helloworld.git"
    path: charts/helloworld
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
