apiVersion: v1
kind: Service
metadata:
  name: {{ include "helloworld.fullname" . }}-svc
  labels:
    app: {{ include "helloworld.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: TCP
  selector:
    app: {{ include "helloworld.name" . }}
